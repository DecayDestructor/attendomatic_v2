[project]
name = "attendomatic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aaryan Mantri", email = "aaryanmantri29@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "fastapi[all,standard]>=0.141.1",
    "fastmcp>=3.4.5",
    "psycopg2>=2.9.12",
    "pydantic-settings>=2.14.2",
    "sqlmodel>=0.0.39",
]

[project.scripts]
attendomatic = "attendomatic:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
